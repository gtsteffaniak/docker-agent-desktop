# Paths dpkg must not unpack into the image. The packages stay installed, so their dependencies
# (libgbm1 and chromium depend on mesa-libgallium, for example) stay satisfied and dpkg's database
# stays consistent. Nothing is written, so no layer carries the files.
#
# Documentation and man pages: not needed at runtime. Copyright files stay, because licences need them.
path-exclude=/usr/share/doc/*
path-include=/usr/share/doc/*/copyright
path-exclude=/usr/share/man/*
path-exclude=/usr/share/info/*

# GPU stack. Headless Chromium runs with --disable-gpu, so none of these are loaded.
#   Mesa Gallium drivers (dri/, libgallium), the LLVM shader compiler, z3 (LLVM's solver),
#   the Vulkan loader and ICDs, and the Vulkan validation layer and software rasteriser in Chromium.
path-exclude=/usr/lib/*/dri/*
path-exclude=/usr/lib/*/libgallium-*.so
path-exclude=/usr/lib/*/libLLVM*.so*
path-exclude=/usr/lib/*/libz3.so*
path-exclude=/usr/lib/*/vulkan/*
path-exclude=/usr/lib/chromium/libVkLayer_khronos_validation.so
path-exclude=/usr/lib/chromium/libvk_swiftshader.so
path-exclude=/usr/lib/chromium/libVkICD_mock_icd.so
