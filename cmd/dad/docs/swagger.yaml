        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Visible text
          schema:
            $ref: '#/definitions/main.browserTextResponse'
        "401":
          description: Missing or wrong token
          schema:
            type: string
        "502":
          description: Could not read the page
          schema:
            type: string
        "503":
          description: Chromium not running
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Browser page text
      tags:
      - browser
