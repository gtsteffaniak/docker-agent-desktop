        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/main.browserSizeRequest'
      responses:
        "204":
          description: Viewport resized
        "400":
          description: Unparsable body
          schema:
            type: string
        "401":
          description: Missing or wrong token
          schema:
            type: string
        "409":
          description: No live session, or held by someone else
