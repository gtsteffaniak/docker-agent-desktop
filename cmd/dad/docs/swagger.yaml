definitions:
  main.ActivityEvent:
    properties:
      actor:
        type: string
      detail:
        type: string
      seq:
        type: integer
      ts:
        type: string
      type:
        type: string
    type: object
  main.FileEntry:
    properties:
      mod_time:
        type: string
      name:
        type: string
      path:
        type: string
      size:
        type: integer
      type:
        description: file | dir
        type: string
    type: object
  main.Session:
    properties:
      acquired_at:
        type: string
      expires_at:
        type: string
      holder:
        $ref: '#/definitions/main.SessionHolder'
      id:
        type: string
      paused:
        type: boolean
    type: object
  main.SessionHolder:
    properties:
      kind:
        description: '"agent" or "user"'
        type: string
      name:
        type: string
      run_id:
        type: string
    type: object
  main.ShellExecRequest:
    properties:
      argv:
        items:
          type: string
        type: array
      background:
        type: boolean
      command:
        type: string
      cwd:
        type: string
      env:
        additionalProperties:
          type: string
        type: object
      timeout_ms:
        type: integer
    type: object
  main.ShellExecResult:
    properties:
      duration_ms:
        type: integer
      exit_code:
        type: integer
      job_id:
        type: string
      status:
        description: completed | running | killed | failed | timeout
        type: string
      stderr:
        type: string
      stdout:
        type: string
      timed_out:
        type: boolean
    type: object
  main.actErrorResponse:
    properties:
      error:
        type: string
    type: object
  main.apiVersionResponse:
    properties:
      api_version:
        example: "1"
        type: string
    type: object
  main.appStartResponse:
    properties:
      id:
        type: string
      running:
        type: boolean
    type: object
  main.appStopResponse:
    properties:
      id:
        type: string
      running:
        type: boolean
    type: object
  main.appV1:
    properties:
      icon:
        type: string
      id:
        type: string
      name:
        type: string
      order:
        type: integer
      port:
        type: integer
      running:
        type: boolean
    type: object
  main.appsListResponse:
    properties:
      apps:
        items:
          $ref: '#/definitions/main.appV1'
        type: array
    type: object
  main.browserActRequest:
    properties:
      button:
        type: integer
      clicks:
        type: integer
      dx:
        type: number
      dy:
        type: number
      key:
        type: string
      kind:
        type: string
      selector:
        type: string
      text:
        type: string
      x:
        type: number
      "y":
        type: number
    type: object
  main.browserEvaluateRequest:
    properties:
      expression:
        type: string
    type: object
  main.browserEvaluateResponse:
    properties:
      value: {}
    type: object
  main.browserInputRequest:
    properties:
      action:
        type: string
      button:
        type: integer
      buttons:
        type: integer
      clicks:
        type: integer
      code:
        type: string
      dx:
        type: number
      dy:
        type: number
      key:
        type: string
      mods:
        type: integer
      text:
        type: string
      type:
        description: pointer | key | scroll | paste
        type: string
      x:
        type: number
      "y":
        type: number
    type: object
  main.browserNavigateRequest:
    properties:
      url:
        type: string
    type: object
  main.browserNavigateResponse:
    properties:
      url:
        type: string
    type: object
  main.browserRunningResponse:
    properties:
      running:
        type: boolean
    type: object
  main.browserSizeRequest:
    properties:
      h:
        type: integer
      scale:
        type: number
      w:
        type: integer
    type: object
  main.browserStateOut:
    properties:
      can_back:
        type: boolean
      can_forward:
        type: boolean
      running:
        type: boolean
      seq:
        description: Seq increases whenever any other field changes, so callers can
          detect updates cheaply.
        type: integer
      title:
        type: string
      url:
        type: string
    type: object
  main.browserTextResponse:
    properties:
      text:
        type: string
    type: object
  main.displayClickRequest:
    properties:
      button:
        type: integer
      x:
        type: integer
      "y":
        type: integer
    type: object
  main.displayDragRequest:
    properties:
      x1:
        type: integer
      x2:
        type: integer
      y1:
        type: integer
      y2:
        type: integer
    type: object
  main.displayKeyRequest:
    properties:
      key:
        type: string
      mods:
        type: integer
    type: object
  main.displayScrollRequest:
    properties:
      dx:
        type: integer
      dy:
        type: integer
      x:
        type: integer
      "y":
        type: integer
    type: object
  main.displayTypeRequest:
    properties:
      text:
        type: string
    type: object
  main.fileMkdirRequest:
    properties:
      path:
        type: string
    type: object
  main.fileMoveRequest:
    properties:
      from:
        type: string
      to:
        type: string
    type: object
  main.fileMoveResponse:
    properties:
      from:
        type: string
      to:
        type: string
    type: object
  main.filePathResponse:
    properties:
      path:
        type: string
    type: object
  main.fileWriteRequest:
    properties:
      content:
        type: string
      encoding:
        description: text (default) | base64
        type: string
      path:
        type: string
    type: object
  main.fileWriteResponse:
    properties:
      path:
        type: string
      size:
        type: integer
    type: object
  main.filesListResponse:
    properties:
      entries:
        items:
          $ref: '#/definitions/main.FileEntry'
        type: array
      path:
        type: string
    type: object
  main.healthChecks:
    properties:
      agent:
        type: string
      broadway:
        type: string
      chromium:
        type: string
      disk:
        type: string
      disk_free_bytes:
        type: integer
      session:
        $ref: '#/definitions/main.healthSessionCheck'
    type: object
  main.healthResponse:
    properties:
      checks:
        $ref: '#/definitions/main.healthChecks'
      status:
        type: string
      uptime_s:
        type: integer
    type: object
  main.healthSessionCheck:
    properties:
      expires_in_s:
        type: integer
      held:
        type: boolean
      holder:
        $ref: '#/definitions/main.SessionHolder'
      paused:
        type: boolean
    type: object
  main.mcpJSONRPCError:
    properties:
      code:
        type: integer
      message:
        type: string
    type: object
  main.mcpJSONRPCRequest:
    properties:
      id: {}
      jsonrpc:
        example: "2.0"
        type: string
      method:
        example: tools/call
        type: string
      params: {}
    type: object
  main.mcpJSONRPCResponse:
    properties:
      error:
        $ref: '#/definitions/main.mcpJSONRPCError'
      id: {}
      jsonrpc:
        example: "2.0"
        type: string
      result: {}
    type: object
  main.sessionAcquireRequest:
    properties:
      holder:
        $ref: '#/definitions/main.SessionHolder'
      ttl_ms:
        type: integer
    type: object
  main.sessionError:
    properties:
      error:
        type: string
      expires_at:
        type: string
      holder:
        $ref: '#/definitions/main.SessionHolder'
      paused:
        type: boolean
    type: object
  main.sessionEventsResponse:
    properties:
      events:
        items:
          $ref: '#/definitions/main.ActivityEvent'
        type: array
      latest_seq:
        type: integer
    type: object
  main.sessionGetResponse:
    properties:
      apps_running:
        items:
          type: string
        type: array
      browser_running:
        type: boolean
      session:
        $ref: '#/definitions/main.Session'
      uptime_s:
        type: integer
      viewers:
        type: integer
    type: object
  main.sessionIDRequest:
    properties:
      session_id:
        type: string
    type: object
  main.sessionReleaseResponse:
    properties:
      released:
        type: boolean
    type: object
  main.sessionTakeoverRequest:
    properties:
      force:
        type: boolean
      holder:
        $ref: '#/definitions/main.SessionHolder'
      ttl_ms:
        type: integer
    type: object
  main.sessionTakeoverResponse:
    properties:
      evicted:
        $ref: '#/definitions/main.Session'
      session:
        $ref: '#/definitions/main.Session'
    type: object
  main.sessionWaitRequest:
    properties:
      timeout_ms:
        type: integer
    type: object
  main.sessionWaitResponse:
    properties:
      apps_running:
        items:
          type: string
        type: array
      browser_running:
        type: boolean
      free:
        type: boolean
      session:
        $ref: '#/definitions/main.Session'
      uptime_s:
        type: integer
      viewers:
        type: integer
      waited_ms:
        type: integer
    type: object
  main.shellJobsResponse:
    properties:
      jobs:
        items:
          $ref: '#/definitions/main.ShellExecResult'
        type: array
    type: object
info:
  contact: {}
  description: 'The stable /v1 API of docker-agent-desktop: shell, files, browser,
    display, apps, sessions, health and the activity log, plus the MCP Streamable
    HTTP endpoint. There is no unversioned /api surface: it was removed in the initial
    release, together with the pre-rename auth names, rather than deprecated.'
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  title: Docker Agent Desktop API
  version: "1"
paths:
  /healthz:
    get:
      description: 'Bare 200. Container liveness only, not session health: use GET
        /v1/health for whether the session is actually usable.'
      produces:
      - text/plain
      responses:
        "200":
          description: Alive
      summary: Container liveness
      tags:
      - meta
  /mcp:
    post:
      consumes:
      - application/json
      description: The Model Context Protocol surface, served as Streamable HTTP (JSON-RPC
        2.0, stateless). Every tool calls the same Agent service methods the /v1 HTTP
        handlers call — never an HTTP round-trip to self. Mutating tools enforce the
        session rule in-process (live session required, id must match, session must
        not be paused); reads never require a session. See docs/mcp.md for the tool
        list.
      parameters:
      - description: Agent token (or the dad_token cookie)
        in: header
        name: X-Dad-Token
        type: string
      - description: JSON-RPC 2.0 request (initialize, tools/list, tools/call, …)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/main.mcpJSONRPCRequest'
      produces:
      - application/json
      responses:
        "200":
          description: JSON-RPC 2.0 response
          schema:
            $ref: '#/definitions/main.mcpJSONRPCResponse'
        "400":
          description: Not a JSON-RPC request, or a non-POST method
          schema:
            type: string
        "401":
          description: Missing or wrong token
          schema:
            type: string
        "405":
          description: Only POST is served
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: MCP endpoint
      tags:
      - mcp
  /v1/apps:
    get:
      description: Lists the registry apps with whether each is running. The browser
        (port 0) is running when its screencast is attached.
      parameters:
      - description: Agent token (or the dad_token cookie)
        in: header
        name: X-Dad-Token
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Registry apps
          schema:
            $ref: '#/definitions/main.appsListResponse'
        "401":
          description: Missing or wrong token
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: List apps
      tags:
      - apps
  /v1/apps/start:
    post:
      description: 'Starts one registry app: its Broadway display first, then the
        app. Starting an app that is already running does nothing. The browser (port
        0) has no process to start; this reports whether Chromium is running instead.'
      parameters:
      - description: Agent token (or the dad_token cookie)
        in: header
        name: X-Dad-Token
        type: string
      - description: Session id of the live session
        in: header
        name: X-Dad-Session
        required: true
        type: string
      - description: Registry app id
        in: query
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: App started (or already running)
          schema:
            $ref: '#/definitions/main.appStartResponse'
        "400":
          description: Unknown app id
          schema:
            type: string
        "401":
          description: Missing or wrong token
          schema:
            type: string
        "409":
          description: No live session, or held by someone else
          schema:
            $ref: '#/definitions/main.sessionError'
        "500":
          description: App start failed
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Start an app
      tags:
      - apps
  /v1/apps/stop:
    post:
      description: Stops one registry app and reports it as not running. Unknown ids
        are a 400, mirroring start. The browser (port 0) has no app process, so stopping
        it stops Chromium. The app's broadwayd display stays running for reuse.
      parameters:
      - description: Agent token (or the dad_token cookie)
        in: header
        name: X-Dad-Token
        type: string
      - description: Session id of the live session
        in: header
        name: X-Dad-Session
        required: true
        type: string
      - description: Registry app id
        in: query
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: App stopped
          schema:
            $ref: '#/definitions/main.appStopResponse'
        "400":
          description: Unknown app id
          schema:
            type: string
        "401":
          description: Missing or wrong token
          schema:
            type: string
        "409":
          description: No live session, or held by someone else
          schema:
            $ref: '#/definitions/main.sessionError'
        "500":
          description: App stop failed
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Stop an app
      tags:
      - apps
  /v1/browser/act:
    post:
      consumes:
      - application/json
      description: 'Performs one high-level browser action: click, type, select, scroll
        or key. Click and scroll take a selector (resolved to its centre) or x/y coordinates;
        type and select take a selector plus text; key takes a key name. A selector
        that matches nothing is a 404.'
      parameters:
      - description: Agent token (or the dad_token cookie)
        in: header
        name: X-Dad-Token
        type: string
      - description: Session id of the live session
        in: header
        name: X-Dad-Session
        required: true
        type: string
      - description: Action to perform
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/main.browserActRequest'
      responses:
        "204":
          description: Action performed
        "400":
          description: Unknown act kind, or select/key missing what they need
          schema:
            type: string
        "401":
          description: Missing or wrong token
          schema:
            type: string
        "404":
          description: Selector matched nothing
          schema:
            $ref: '#/definitions/main.actErrorResponse'
        "409":
          description: No live session, or held by someone else
          schema:
            $ref: '#/definitions/main.sessionError'
        "502":
          description: Action failed
          schema:
            type: string
        "503":
          description: Chromium not running
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Browser action
      tags:
      - browser
  /v1/browser/back:
    post:
      description: Goes back in the page history.
      parameters:
      - description: Agent token (or the dad_token cookie)
        in: header
        name: X-Dad-Token
        type: string
      - description: Session id of the live session
        in: header
        name: X-Dad-Session
        required: true
        type: string
      responses:
        "204":
          description: Went back
        "401":
          description: Missing or wrong token
          schema:
            type: string
        "409":
          description: No live session, or held by someone else
          schema:
            $ref: '#/definitions/main.sessionError'
        "502":
          description: Navigation failed
          schema:
            type: string
        "503":
          description: Chromium not running
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Browser back
      tags:
      - browser
  /v1/browser/evaluate:
    post:
      consumes:
      - application/json
      description: Runs one JavaScript expression in the page and returns its value
        as raw JSON (undefined, functions and other values with no JSON form become
        null). The expression is capped at 64 KiB.
      parameters:
      - description: Agent token (or the dad_token cookie)
        in: header
        name: X-Dad-Token
        type: string
      - description: Session id of the live session
        in: header
        name: X-Dad-Session
        required: true
        type: string
      - description: Expression to evaluate
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/main.browserEvaluateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Expression value
          schema:
            $ref: '#/definitions/main.browserEvaluateResponse'
        "400":
          description: Unparsable body
          schema:
            type: string
        "401":
          description: Missing or wrong token
          schema:
            type: string
        "409":
          description: No live session, or held by someone else
          schema:
            $ref: '#/definitions/main.sessionError'
        "502":
          description: Evaluation failed
          schema:
            type: string
        "503":
          description: Chromium not running
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Evaluate JavaScript in the page
      tags:
      - browser
  /v1/browser/forward:
    post:
      description: Goes forward in the page history.
      parameters:
      - description: Agent token (or the dad_token cookie)
        in: header
        name: X-Dad-Token
        type: string
      - description: Session id of the live session
        in: header
        name: X-Dad-Session
        required: true
        type: string
      responses:
        "204":
          description: Went forward
        "401":
          description: Missing or wrong token
          schema:
            type: string
        "409":
          description: No live session, or held by someone else
          schema:
            $ref: '#/definitions/main.sessionError'
        "502":
          description: Navigation failed
          schema:
            type: string
        "503":
          description: Chromium not running
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Browser forward
      tags:
      - browser
  /v1/browser/frame:
    get:
      description: 'One frame of the page. Without ?since it takes a fresh screenshot
        (JPEG by default, PNG with ?format=png). With ?since=N it serves the screencast
        for a polling client: 204 when no frame newer than N exists. The X-Frame-Seq
        header carries the frame sequence number to poll with next.'
      parameters:
      - description: Agent token (or the dad_token cookie)
        in: header
        name: X-Dad-Token
        type: string
      - description: Image format
        enum:
        - jpeg
        - png
        in: query
        name: format
        type: string
      - description: 'Poll: only a frame newer than this sequence number (JPEG only)'
        in: query
        name: since
        type: integer
      produces:
      - image/jpeg
      - image/png
      responses:
        "200":
          description: Frame image
          headers:
            X-Frame-Seq:
              description: Sequence number of the frame
              type: string
          schema:
            type: file
        "204":
          description: No frame newer than ?since=
        "400":
          description: Unknown format, or since polling with format=png
          schema:
            type: string
        "401":
          description: Missing or wrong token
          schema:
            type: string
        "503":
          description: Chromium not running
          schema:
            type: string
        "504":
          description: Screenshot timed out
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Browser frame
      tags:
      - browser
  /v1/browser/input:
    post:
      consumes:
      - application/json
      description: 'Forwards one pointer, scroll, key or paste event to the page.
        Which fields apply depends on type: pointer takes action/x/y/button/buttons/clicks/mods,
        key takes action/key/code/text/mods, scroll takes x/y/dx/dy/mods, paste takes
        text.'
      parameters:
      - description: Agent token (or the dad_token cookie)
        in: header
        name: X-Dad-Token
        type: string
      - description: Session id of the live session
        in: header
        name: X-Dad-Session
        required: true
        type: string
      - description: One input event
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/main.browserInputRequest'
      responses:
        "204":
          description: Input delivered
        "400":
          description: Unparsable body, or unknown input type
          schema:
            type: string
        "401":
          description: Missing or wrong token
          schema:
            type: string
        "409":
          description: No live session, or held by someone else
          schema:
            $ref: '#/definitions/main.sessionError'
        "502":
          description: Input failed
          schema:
            type: string
        "503":
          description: Chromium not running
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Send browser input
      tags:
      - browser
  /v1/browser/navigate:
    post:
      consumes:
      - application/json
      description: Navigates the page. Navigating is what starts Chromium, so the
        first address starts it. The reply is the normalized URL that was navigated
        to.
      parameters:
      - description: Agent token (or the dad_token cookie)
        in: header
        name: X-Dad-Token
        type: string
      - description: Session id of the live session
        in: header
        name: X-Dad-Session
        required: true
        type: string
      - description: URL to navigate to
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/main.browserNavigateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Normalized URL navigated to
          schema:
            $ref: '#/definitions/main.browserNavigateResponse'
        "400":
          description: Unparsable body, or unusable URL
          schema:
            type: string
        "401":
          description: Missing or wrong token
          schema:
            type: string
        "409":
          description: No live session, or held by someone else
          schema:
            $ref: '#/definitions/main.sessionError'
        "502":
          description: Navigation failed
          schema:
            type: string
        "503":
          description: Chromium could not start
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Navigate the browser
      tags:
      - browser
  /v1/browser/reload:
    post:
      description: Reloads the page.
      parameters:
      - description: Agent token (or the dad_token cookie)
        in: header
        name: X-Dad-Token
        type: string
      - description: Session id of the live session
        in: header
        name: X-Dad-Session
        required: true
        type: string
      responses:
        "204":
          description: Reloaded
        "401":
          description: Missing or wrong token
          schema:
            type: string
        "409":
          description: No live session, or held by someone else
          schema:
            $ref: '#/definitions/main.sessionError'
        "502":
          description: Navigation failed
          schema:
            type: string
        "503":
          description: Chromium not running
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Reload the browser
      tags:
      - browser
  /v1/browser/size:
    post:
      consumes:
      - application/json
      description: Sets the browser viewport size (CSS pixels, with the device pixel
        ratio as scale).
      parameters:
      - description: Agent token (or the dad_token cookie)
        in: header
        name: X-Dad-Token
        type: string
      - description: Session id of the live session
        in: header
        name: X-Dad-Session
        required: true
