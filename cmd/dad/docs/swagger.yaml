  /v1/files:
    delete:
      description: Removes a file or directory. Directories need recursive=true unless
        empty. The home directory itself can never be deleted. A final symlink is
        removed itself, never its target.
      parameters:
      - description: Agent token (or the dad_token cookie)
        in: header
        name: X-Dad-Token
        type: string
      - description: Session id of the live session
        in: header
        name: X-Dad-Session
        required: true
        type: string
      - description: Home-relative path to delete
        in: query
        name: path
        required: true
        type: string
      - description: Recursively delete a non-empty directory
        enum:
        - "1"
        - "true"
        in: query
        name: recursive
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Deleted path
          schema:
            $ref: '#/definitions/main.filePathResponse'
        "400":
          description: Path missing, escapes the jail, is home itself, or a non-empty
            directory without recursive
          schema:
            type: string
        "401":
          description: Missing or wrong token
          schema:
            type: string
        "404":
          description: Path not found
          schema:
            type: string
        "409":
          description: No live session, or held by someone else
          schema:
            $ref: '#/definitions/main.sessionError'
      security:
      - ApiKeyAuth: []
      summary: Delete a file or directory
      tags:
      - files
  /v1/files/list:
    get:
      description: Lists one jailed directory. ?path= is home-relative (empty means
        home). Paths are home-relative in the reply.
      parameters:
      - description: Agent token (or the dad_token cookie)
        in: header
        name: X-Dad-Token
        type: string
      - description: Home-relative directory (empty means home)
        in: query
        name: path
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Directory listing
          schema:
            $ref: '#/definitions/main.filesListResponse'
        "400":
          description: Path escapes the home jail
          schema:
            type: string
        "401":
          description: Missing or wrong token
          schema:
            type: string
        "404":
          description: Directory not found
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: List files
      tags:
      - files
  /v1/files/mkdir:
    post:
      consumes:
      - application/json
      description: Creates a directory and its parents, jailed under home.
      parameters:
      - description: Agent token (or the dad_token cookie)
        in: header
        name: X-Dad-Token
        type: string
      - description: Session id of the live session
        in: header
        name: X-Dad-Session
        required: true
        type: string
      - description: Directory path
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/main.fileMkdirRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Created path
          schema:
            $ref: '#/definitions/main.filePathResponse'
        "400":
          description: Path missing or escapes the jail
          schema:
            type: string
        "401":
          description: Missing or wrong token
          schema:
            type: string
        "409":
          description: No live session, or held by someone else
          schema:
            $ref: '#/definitions/main.sessionError'
      security:
      - ApiKeyAuth: []
      summary: Make a directory
      tags:
      - files
  /v1/files/move:
    post:
      consumes:
      - application/json
      description: Renames within the jail. The destination must not already exist.
        Deleting or moving the home directory itself is refused.
      parameters:
      - description: Agent token (or the dad_token cookie)
        in: header
        name: X-Dad-Token
        type: string
      - description: Session id of the live session
        in: header
        name: X-Dad-Session
        required: true
        type: string
      - description: Source and destination paths
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/main.fileMoveRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Moved paths
          schema:
            $ref: '#/definitions/main.fileMoveResponse'
        "400":
          description: from/to missing, path escapes the jail, destination exists,
            or home itself
          schema:
            type: string
        "401":
          description: Missing or wrong token
          schema:
            type: string
        "404":
          description: Source not found
          schema:
            type: string
        "409":
          description: No live session, or held by someone else
          schema:
            $ref: '#/definitions/main.sessionError'
      security:
      - ApiKeyAuth: []
      summary: Move or rename a file
      tags:
      - files
  /v1/files/read:
    get:
      description: Returns one file's bytes, capped at 10 MiB. ?download=1 adds a
        Content-Disposition attachment header.
      parameters:
      - description: Agent token (or the dad_token cookie)
        in: header
        name: X-Dad-Token
        type: string
      - description: Home-relative file path
        in: query
        name: path
        required: true
        type: string
      - description: Send as a download attachment
        enum:
        - "1"
        in: query
        name: download
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: File bytes
          schema:
            type: file
        "400":
          description: Path escapes the home jail, or is a directory
          schema:
            type: string
        "401":
          description: Missing or wrong token
          schema:
            type: string
        "404":
          description: File not found
          schema:
            type: string
        "413":
          description: File exceeds the 10 MiB limit
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Read a file
      tags:
      - files
  /v1/files/upload:
    post:
      consumes:
      - multipart/form-data
      description: Writes one multipart file (field "file") to the "path" form field.
        A trailing slash (or an existing directory) means "into this directory". The
        whole body is bounded, so an oversized upload cannot fill the disk with multipart
        temp files.
      parameters:
      - description: Agent token (or the dad_token cookie)
        in: header
        name: X-Dad-Token
        type: string
      - description: Session id of the live session
        in: header
        name: X-Dad-Session
        required: true
        type: string
      - description: File to upload
        in: formData
        name: file
        required: true
        type: file
      - description: Home-relative destination path (or directory)
        in: formData
        name: path
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Written path and byte count
          schema:
            $ref: '#/definitions/main.fileWriteResponse'
        "400":
          description: Missing file/path fields, or path escapes the jail
          schema:
            type: string
        "401":
          description: Missing or wrong token
          schema:
            type: string
        "409":
          description: No live session, or held by someone else
          schema:
            $ref: '#/definitions/main.sessionError'
        "413":
          description: File exceeds the 10 MiB limit
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Upload a file
      tags:
      - files
  /v1/files/write:
    post:
      consumes:
      - application/json
      description: Writes data, creating parent directories as needed. Content over
        10 MiB is refused, so everything written can be read back. Encoding "text"
        (default) writes the content as-is; "base64" decodes it first.
      parameters:
      - description: Agent token (or the dad_token cookie)
        in: header
        name: X-Dad-Token
        type: string
      - description: Session id of the live session
        in: header
        name: X-Dad-Session
        required: true
        type: string
      - description: Path, content and encoding
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/main.fileWriteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Written path and byte count
          schema:
            $ref: '#/definitions/main.fileWriteResponse'
        "400":
          description: Path missing, path escapes the jail, or bad encoding/base64
          schema:
            type: string
        "401":
          description: Missing or wrong token
          schema:
            type: string
        "409":
          description: No live session, or held by someone else
          schema:
            $ref: '#/definitions/main.sessionError'
        "413":
          description: Content exceeds the 10 MiB limit
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Write a file
      tags:
      - files
  /v1/health:
    get:
      description: 'The real health check: whether the session is actually usable.
        Probes Chromium, Broadway, disk space and the session lease, and reports each
        piece, so a caller can tell a dead browser from a dead display from a full
        disk instead of getting one opaque 503. A transition into degraded is recorded
        once in the activity log.'
      parameters:
      - description: Agent token (or the dad_token cookie)
        in: header
        name: X-Dad-Token
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Health, ok or degraded
          schema:
            $ref: '#/definitions/main.healthResponse'
        "401":
          description: Missing or wrong token
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Session health
      tags:
      - health
  /v1/meta:
    get:
      description: Unauthenticated. Returns the API version ("1").
      produces:
      - application/json
      responses:
        "200":
          description: API version
          schema:
            $ref: '#/definitions/main.apiVersionResponse'
      summary: API version
      tags:
      - meta
  /v1/session:
    get:
      description: 'The live session (or null) plus browser state, viewer count, running
        apps and uptime: what a waiting caller needs to decide whether to wait.'
      parameters:
      - description: Agent token (or the dad_token cookie)
        in: header
        name: X-Dad-Token
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Current state
          schema:
            $ref: '#/definitions/main.sessionGetResponse'
        "401":
          description: Missing or wrong token
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Current session state
      tags:
      - session
  /v1/session/acquire:
    post:
      consumes:
      - application/json
      description: 'Acquires the single session lease. Exactly one holder at a time:
        a second acquire is a 409 naming the current holder. The lease TTL defaults
        to 90 s (DAD_SESSION_LEASE_MS, clamped to 10 s..10 min); keep it alive with
        POST /v1/session/keepalive.'
      parameters:
      - description: Agent token (or the dad_token cookie)
        in: header
        name: X-Dad-Token
        type: string
      - description: Holder and optional lease TTL
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/main.sessionAcquireRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Lease acquired
          schema:
            $ref: '#/definitions/main.Session'
        "400":
          description: holder.name missing or holder.kind not agent/user
          schema:
            type: string
        "401":
          description: Missing or wrong token
          schema:
            type: string
        "409":
          description: Session already held
          schema:
            $ref: '#/definitions/main.sessionError'
      security:
      - ApiKeyAuth: []
      summary: Acquire the session
      tags:
      - session
  /v1/session/events:
    get:
      description: Activity-log events with sequence number greater than ?since=,
        up to ?limit= (default 100, max 500). Poll with the latest_seq returned to
        follow the log.
      parameters:
      - description: Agent token (or the dad_token cookie)
        in: header
        name: X-Dad-Token
        type: string
      - description: Only events with seq greater than this
        in: query
        name: since
        type: integer
      - description: Maximum events to return (default 100, max 500)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Events and the latest sequence number
          schema:
            $ref: '#/definitions/main.sessionEventsResponse'
        "401":
          description: Missing or wrong token
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Activity log events
      tags:
      - events
  /v1/session/keepalive:
    post:
      consumes:
      - application/json
      description: 'Extends the lease on a live session. A keepalive for an expired,
        released or taken-over session is a 409: re-acquire instead.'
      parameters:
      - description: Agent token (or the dad_token cookie)
        in: header
        name: X-Dad-Token
        type: string
      - description: Session id
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/main.sessionIDRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Lease extended
          schema:
            $ref: '#/definitions/main.Session'
        "400":
          description: Unparsable body
          schema:
            type: string
        "401":
          description: Missing or wrong token
          schema:
            type: string
        "409":
          description: No such session, or held by someone else
          schema:
            $ref: '#/definitions/main.sessionError'
      security:
      - ApiKeyAuth: []
      summary: Keep the session alive
      tags:
      - session
  /v1/session/pause:
    post:
      consumes:
      - application/json
      description: Pauses or resumes the live session. While paused, control messages
        are refused but the lease is still held. A pause/resume for a session that
        is not the live one is a 409.
      parameters:
      - description: Agent token (or the dad_token cookie)
        in: header
        name: X-Dad-Token
        type: string
      - description: Session id
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/main.sessionIDRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Session paused or resumed
          schema:
            $ref: '#/definitions/main.Session'
        "400":
          description: Unparsable body
          schema:
            type: string
        "401":
          description: Missing or wrong token
          schema:
            type: string
        "409":
          description: No such session, or held by someone else
          schema:
            $ref: '#/definitions/main.sessionError'
      security:
      - ApiKeyAuth: []
      summary: Pause or resume the session
      tags:
      - session
  /v1/session/release:
    post:
      consumes:
      - application/json
      description: Releases a live session. Releasing a session that is not held is
        a 404.
      parameters:
      - description: Agent token (or the dad_token cookie)
        in: header
        name: X-Dad-Token
        type: string
      - description: Session id
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/main.sessionIDRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Released
          schema:
            $ref: '#/definitions/main.sessionReleaseResponse'
        "400":
          description: Unparsable body
          schema:
            type: string
        "401":
          description: Missing or wrong token
          schema:
            type: string
        "404":
          description: No such session
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Release the session
      tags:
      - session
  /v1/session/resume:
    post:
      consumes:
      - application/json
      description: Pauses or resumes the live session. While paused, control messages
        are refused but the lease is still held. A pause/resume for a session that
        is not the live one is a 409.
      parameters:
      - description: Agent token (or the dad_token cookie)
        in: header
        name: X-Dad-Token
        type: string
      - description: Session id
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/main.sessionIDRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Session paused or resumed
          schema:
            $ref: '#/definitions/main.Session'
        "400":
          description: Unparsable body
          schema:
            type: string
        "401":
          description: Missing or wrong token
          schema:
            type: string
        "409":
          description: No such session, or held by someone else
          schema:
            $ref: '#/definitions/main.sessionError'
      security:
      - ApiKeyAuth: []
      summary: Pause or resume the session
      tags:
      - session
  /v1/session/takeover:
    post:
      consumes:
      - application/json
      description: 'Force-acquires the lease, evicting whoever holds it. Requires
        explicit "force": true — evicting another holder is deliberate, never accidental.
        The evicted holder is named in the activity log and in the response, so a
        takeover is always visible after the fact.'
      parameters:
      - description: Agent token (or the dad_token cookie)
        in: header
        name: X-Dad-Token
        type: string
      - description: New holder, with force=true
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/main.sessionTakeoverRequest'
      produces:
      - application/json
      responses:
        "201":
          description: New session and the evicted one (or null)
          schema:
            $ref: '#/definitions/main.sessionTakeoverResponse'
        "400":
          description: force is not true, or holder.name missing / holder.kind not
            agent/user
          schema:
            type: string
        "401":
          description: Missing or wrong token
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Take over the session
      tags:
      - session
  /v1/session/wait:
    post:
      consumes:
      - application/json
      description: 'Long-polls until the lease is free or the timeout elapses (default
        30 s, clamped to 1 s..5 min). It never acquires: it only reports. A caller
        that sees free=true still has to acquire — another contender can take the
        lease between the wait returning and the acquire landing. A read, so no session
        is needed to call it.'
      parameters:
      - description: Agent token (or the dad_token cookie)
        in: header
        name: X-Dad-Token
        type: string
      - description: Optional wait timeout
        in: body
        name: body
        schema:
          $ref: '#/definitions/main.sessionWaitRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Wait result
          schema:
            $ref: '#/definitions/main.sessionWaitResponse'
        "400":
          description: Unparsable body
          schema:
            type: string
        "401":
          description: Missing or wrong token
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Wait for the session to free up
      tags:
      - session
  /v1/shell/exec:
    post:
      consumes:
      - application/json
      description: Runs one command. Exactly one of command (/bin/sh -c) or argv (direct
        exec) must be set. Synchronously unless background=true, in which case it
        starts the process and returns immediately with status "running" and a job
        id to poll. Non-zero exits are results with status "failed", not errors. Output
        is capped at 1 MiB per stream.
      parameters:
      - description: Agent token (or the dad_token cookie)
        in: header
        name: X-Dad-Token
        type: string
      - description: Session id of the live session
        in: header
        name: X-Dad-Session
        required: true
        type: string
      - description: Command to run
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/main.ShellExecRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Execution result (or a running job)
          schema:
            $ref: '#/definitions/main.ShellExecResult'
        "400":
          description: Neither or both of command/argv set
          schema:
            type: string
        "401":
          description: Missing or wrong token
          schema:
            type: string
        "409":
          description: No live session, or held by someone else
          schema:
            $ref: '#/definitions/main.sessionError'
        "429":
          description: Too many running shell jobs
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Run a shell command
      tags:
      - shell
  /v1/shell/jobs:
    get:
      description: All tracked jobs, oldest first. A running job reports the output
        captured so far and its elapsed time.
      parameters:
      - description: Agent token (or the dad_token cookie)
        in: header
        name: X-Dad-Token
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Tracked jobs
          schema:
            $ref: '#/definitions/main.shellJobsResponse'
        "401":
          description: Missing or wrong token
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: List shell jobs
      tags:
      - shell
  /v1/shell/jobs/{id}:
    get:
      description: One job's current result. A running job reports the output captured
        so far and its elapsed time.
      parameters:
      - description: Agent token (or the dad_token cookie)
        in: header
        name: X-Dad-Token
        type: string
      - description: Job id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Job result
          schema:
            $ref: '#/definitions/main.ShellExecResult'
        "401":
          description: Missing or wrong token
          schema:
            type: string
        "404":
          description: Unknown job
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Get a shell job
      tags:
      - shell
  /v1/shell/jobs/{id}/kill:
    post:
      description: SIGKILLs a running job's whole process group (children included).
        Waits briefly for the waiter to finalize the result, so the response reflects
        the kill.
      parameters:
      - description: Agent token (or the dad_token cookie)
        in: header
        name: X-Dad-Token
        type: string
      - description: Session id of the live session
        in: header
        name: X-Dad-Session
        required: true
        type: string
      - description: Job id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Finalized job result
          schema:
            $ref: '#/definitions/main.ShellExecResult'
        "401":
          description: Missing or wrong token
          schema:
            type: string
        "404":
          description: Unknown or already-finished job
          schema:
            type: string
        "409":
          description: No live session, or held by someone else
          schema:
            $ref: '#/definitions/main.sessionError'
      security:
      - ApiKeyAuth: []
      summary: Kill a shell job
      tags:
      - shell
securityDefinitions:
  ApiKeyAuth:
    description: Agent token, set from DAD_TOKEN. The dad_token portal cookie is accepted
      as an alternative.
    in: header
    name: X-Dad-Token
    type: apiKey
swagger: "2.0"
