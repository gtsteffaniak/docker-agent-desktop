        "409":
          description: No live session, or held by someone else
          schema:
            $ref: '#/definitions/main.sessionError'
      security:
      - ApiKeyAuth: []
      summary: Stop the browser
      tags:
      - browser
  /v1/browser/stream:
    get:
      description: 'The live browser socket: binary JPEG frames and navigation-state
        messages pumped down, navigate/pointer/key/scroll/paste/size commands read
        in order. A WebSocket cannot carry the X-Dad-Session header, so the session
        travels as ?session=<id> at connect, or a {"type":"session","session_id":"..."}
        message that (re)binds the socket mid-connection. Frames and state flow without
        a session (reads); every control message is refused while no live, unpaused
        session is bound. A ?session= naming no live session is a 409 at connect time.
        Control messages carrying an "id" get an {"type":"ack","id","ok","error"}
        reply.'
      parameters:
      - description: Agent token (or the dad_token cookie)
        in: header
        name: X-Dad-Token
        type: string
      - description: Session id to bind at connect (control messages need a live,
          unpaused session bound)
        in: query
        name: session
        type: string
      responses:
        "101":
          description: Switched to the WebSocket protocol
        "401":
          description: Missing or wrong token
          schema:
            type: string
        "409":
          description: ?session= names no live session
          schema:
            $ref: '#/definitions/main.sessionError'
      security:
      - ApiKeyAuth: []
      summary: Browser live stream
      tags:
      - browser
  /v1/browser/text:
    get:
      description: Returns the page's visible text.
      parameters:
      - description: Agent token (or the dad_token cookie)
        in: header
