name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
      - name: Lint
        run: |
          test -z "$(gofmt -l . )" || (gofmt -l .; exit 1)
          go vet ./...
      - name: Unit tests
        run: go test -race ./...

  image:
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@v4
      - name: Hadolint
        run: docker run --rm -v "$PWD":/src:ro -w /src ghcr.io/hadolint/hadolint hadolint --config /src/.hadolint.yaml docker/Dockerfile
      - name: Build image
        run: DOCKER_BUILDKIT=1 docker build -f docker/Dockerfile -t docker-computer:ci .
      - name: End-to-end
        run: DC_IMAGE=docker-computer:ci DOCKER=docker ./scripts/e2e.sh
        env:
          COMPUTER_AGENT_TOKEN: ci-token
      - name: Dive (image efficiency gate)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.dive-ci:/.dive-ci:ro" wagoodman/dive:latest docker-computer:ci --ci
