name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
      - name: Lint
        run: |
          test -z "$(gofmt -l . )" || (gofmt -l .; exit 1)
          go vet ./...
      - name: Unit tests
        run: go test -race ./...
      - name: OpenAPI spec is current
        run: |
          go install github.com/swaggo/swag/cmd/swag@v1.16.4
          export PATH="$PATH:$(go env GOPATH)/bin"
          swag init --generalInfo main.go --dir ./cmd/dad --output ./cmd/dad/docs --parseDependency --parseInternal
          git diff --exit-code -- cmd/dad/docs/ || (echo "OpenAPI spec is stale: run 'make swagger' and commit the result"; exit 1)

  image:
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@v4
      - name: Hadolint
        run: docker run --rm -v "$PWD":/src:ro -w /src ghcr.io/hadolint/hadolint hadolint --config /src/.hadolint.yaml docker/Dockerfile
      - name: Build image
        run: DOCKER_BUILDKIT=1 docker build -f docker/Dockerfile -t docker-agent-desktop:ci .
      - name: End-to-end
        run: DAD_IMAGE=docker-agent-desktop:ci DOCKER=docker ./scripts/e2e.sh
        env:
          DAD_TOKEN: ci-token
      - name: Dive (image efficiency gate)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.dive-ci:/.dive-ci:ro" wagoodman/dive:latest docker-agent-desktop:ci --ci
